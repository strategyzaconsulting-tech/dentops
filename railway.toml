[build]
builder = "nixpacks"
buildCommand = "pnpm install --frozen-lockfile && cd apps/api && npx prisma generate"

[deploy]
startCommand = "cd apps/api && npx prisma migrate deploy && npx tsx src/index.ts"
healthcheckPath = "/api/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
