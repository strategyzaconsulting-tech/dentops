[build]
builder = "nixpacks"
buildCommand = "pnpm install --frozen-lockfile && cd apps/api && npx prisma generate && npx prisma migrate deploy && echo 'build-ok'"

[deploy]
startCommand = "cd apps/api && npx tsx src/index.ts"
healthcheckPath = "/api/health"
healthcheckTimeout = 120
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
